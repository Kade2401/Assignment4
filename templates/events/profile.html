{% load static %}
{% load avatar_extras %}
<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>User Profile</title>

  <link rel="stylesheet" href="{% static 'css/profile.css' %}">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
</head>

<body>
  <div class="content-card profile-card">

    <div class="back-to-menu">
      <a href="{% url 'event_list' %}" class="back-btn">
        <i class="fas fa-arrow-left"></i> Back to main menu
      </a>
    </div>

    <div class="profile-header">
      <div class="avatar" style="display:grid;place-items:center;background:radial-gradient(circle at 30% 30%, #5fa8ff, #1e6fd9);">
        <span style="display:block;color:white;font-size:52px;font-weight:800;line-height:1;margin:0;padding:0;">
          {{ user.username|first|upper }}
        </span>
      </div>

      <div class="profile-info">
        <h2 class="nickname">{{ user.username }}</h2>
        <p class="creation-date">Creation date: {{ user.date_joined|date:"d.m.Y" }}</p>

        <div class="delete_account">
          <form method="POST" action="{% url 'logout' %}">
            {% csrf_token %}
            <button type="submit" class="logout-button">Log out</button>
          </form>

          <form action="{% url 'delete_account' %}" method="POST"
                onsubmit="return confirm('Are you sure you want to delete your account? This action is irreversible');">
            {% csrf_token %}
            <button type="submit" class="delete-button">Delete account</button>
          </form>
        </div>
      </div>
    </div>

    <!-- ✅ КАРТА СНИЗУ -->
    <div style="margin-top: 32px;">
      <h3 style="margin-bottom: 10px;">My events on map</h3>
      <div id="profile-map" style="height: 420px; border-radius: 14px; overflow: hidden;"></div>
    </div>

  </div>

  <script>
    document.addEventListener("DOMContentLoaded", () => {
      const mapEl = document.getElementById("profile-map");
      if (!mapEl) return;

      const map = L.map("profile-map").setView([20, 0], 2); // мир

      L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", {
        attribution: "© OpenStreetMap contributors"
      }).addTo(map);

      fetch("{% url 'api_profile_events' %}")
        .then(r => r.json())
        .then(({events}) => {
          if (!events || events.length === 0) return;

          const bounds = [];

          events.forEach(ev => {
            const marker = L.marker([ev.lat, ev.lng]).addTo(map);

            const badge = ev.is_global ? "🌍 Global" : "👤 Personal";
            marker.bindPopup(`
              <b>${ev.name}</b><br>
              ${badge}<br>
              📅 ${ev.date}<br>
              ${ev.location_name ? "📍 " + ev.location_name + "<br>" : ""}
              ${ev.location_address ? ev.location_address + "<br>" : ""}
              <a href="${ev.url}">Open</a>
            `);

            bounds.push([ev.lat, ev.lng]);
          });

          map.fitBounds(bounds, {padding: [30, 30]});
        })
        .catch(console.error);
    });
  </script>

</body>
</html>
