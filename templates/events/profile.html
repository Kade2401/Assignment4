{% load static %}
{% load avatar_extras %}
<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>User Profile</title>
    <link rel="stylesheet" href="{% static 'css/profile.css' %}">
</head>
<body>
    <div class="content-card profile-card">

        <div class="back-to-menu">
            <a href="{% url 'event_list' %}" class="back-btn">
                <i class="fas fa-arrow-left"></i> Back to main menu
            </a>
        </div>

        <div class="profile-header">
            <div
            class="avatar"
            style="
                display: grid;
                place-items: center;
                background: radial-gradient(circle at 30% 30%, #5fa8ff, #1e6fd9);
            "
            >
            <span
                style="
                display: block;
                color: white;
                font-size: 52px;
                font-weight: 800;
                line-height: 1;
                margin: 0;
                padding: 0;
                "
            >
                {{ user.username|first|upper }}
            </span>
            </div>
            <div class="profile-info">
                <h2 class="nickname">{{ user.username }}</h2>
                <p class="creation-date">Creation date: {{ user.date_joined|date:"d.m.Y" }}</p>

                <div class="delete_account">

                    <form method="POST" action="{% url 'logout' %}">
                        {% csrf_token %}
                        <button type="submit" class="logout-button">
                            Log out
                        </button>
                    </form>

                    <form action="{% url 'delete_account' %}" method="POST" onsubmit="return confirm('Are you sure you want to delete your account? This action is irreversible');">
                        {% csrf_token %}
                        <button type="submit" class="delete-button">
                            Delete account
                        </button>
                    </form>
                </div>
            </div>
        </div>
    </div>
    <script>
  (function () {
    const el = document.querySelector('.avatar-letter');
    if (!el) return;

    const name = (el.dataset.name || '').trim();
    if (!name) return;

    // простой стабильный "хэш" -> hue 0..359
    let hash = 0;
    for (let i = 0; i < name.length; i++) {
      hash = (hash * 31 + name.charCodeAt(i)) >>> 0;
    }
    const hue = hash % 360;

    el.style.background = `radial-gradient(circle at 30% 30%,
      hsl(${hue} 85% 70%) 0%,
      hsl(${hue} 85% 55%) 45%,
      hsl(${hue} 85% 40%) 100%)`;
  })();
</script>
</body>
</html>
